name: Automerge and Approve

on:
  workflow_run:
    workflows: # Every CI workflow that has to pass before merging
      - "Kubeconform"
      - "Flate"
      - "HelmRelease Test"
    types:
      - completed

concurrency:
  group: automerge-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  automerge:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - id: automerge
        name: automerge
        uses: "pascalgn/automerge-action@7961b8b5eec56cc088c140b56d864285eabd3f67" # v0.16.4
        env:
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
          UPDATE_RETRIES: 24
          UPDATE_RETRY_SLEEP: 60000
          MERGE_RETRIES: 24
          MERGE_RETRY_SLEEP: 60000
          MERGE_METHOD: "squash"
          # Only merge when every check has finished successfully
          MERGE_READY_STATE: "clean,has_hooks"
