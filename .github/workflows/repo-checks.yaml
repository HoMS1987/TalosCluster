---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Repo Checks

# Checks for the repo tooling, each only when its files change (based on alfi0812/talos):
#   - actionlint: GitHub workflow files and the scripts they run
#   - Renovate config: validated with the pinned Renovate version (the hosted Mend app
#     does not expose its version, Renovate keeps this pin up to date)
#   - pre-commit: the hooks of .pre-commit-config.yaml on all files (every PR)

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  filter:
    name: Repo Checks - Filter
    runs-on: ubuntu-latest
    outputs:
      workflows: ${{ steps.workflows.outputs.changed_files }}
      renovate: ${{ steps.renovate.outputs.changed_files }}
    steps:
      - name: Workflow files
        id: workflows
        uses: bjw-s-labs/action-changed-files@147be9638332cf68fd60714a610509d7a9360d60 # v0.7.0
        with:
          patterns: |
            .github/workflows/**/*
            .github/scripts/**/*
      - name: Renovate config
        id: renovate
        uses: bjw-s-labs/action-changed-files@147be9638332cf68fd60714a610509d7a9360d60 # v0.7.0
        with:
          patterns: |
            .github/renovate.json5
            .github/renovate/**/*
            .github/workflows/repo-checks.yaml

  actionlint:
    if: ${{ needs.filter.outputs.workflows != '[]' }}
    needs: filter
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup actionlint
        env:
          # renovate: datasource=github-releases depName=rhysd/actionlint
          ACTIONLINT_VERSION: v1.7.12
        run: |
          bin="$HOME/.local/bin"
          mkdir -p "$bin"
          curl -fsSL "https://github.com/rhysd/actionlint/releases/download/${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION#v}_linux_amd64.tar.gz" \
            | tar xz -C "$bin" actionlint
          echo "$bin" >> "$GITHUB_PATH"
      # Also runs shellcheck (preinstalled on the runner) on the run: scripts.
      - name: Run actionlint
        run: actionlint -color -shellcheck="$(command -v shellcheck)"

  renovate:
    if: ${{ needs.filter.outputs.renovate != '[]' }}
    needs: filter
    name: Renovate config
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # --strict also fails on options that need a migration
      - name: Validate Renovate config
        env:
          # renovate: datasource=docker depName=ghcr.io/renovatebot/renovate
          RENOVATE_VERSION: 44.264.1
        # The glob is expanded by the runner's shell, so expand it inside .github where the
        # files are; from the repo root it would stay a literal "renovate/*.json5".
        working-directory: .github
        run: |
          files=(renovate.json5 renovate/*.json5)
          docker run --rm -v "$PWD:/cfg:ro" -w /cfg "ghcr.io/renovatebot/renovate:${RENOVATE_VERSION}" \
            renovate-config-validator --strict --no-global "${files[@]}"

  # The same hooks as the local git hook (whitespace, final newline, YAML syntax, merge
  # conflict markers). Fixes are not pushed: run `pre-commit run --all-files` and commit.
  pre-commit:
    name: pre-commit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup pre-commit
        env:
          # renovate: datasource=pypi depName=pre-commit
          PRE_COMMIT_VERSION: 4.7.0
        run: pipx install "pre-commit==${PRE_COMMIT_VERSION}"
      - name: Run pre-commit
        run: pre-commit run --all-files --show-diff-on-failure --color always

  success:
    if: ${{ !cancelled() }}
    needs:
      - actionlint
      - renovate
      - pre-commit
    name: Repo Checks - Success
    runs-on: ubuntu-latest
    steps:
      - name: Any jobs failed?
        if: ${{ contains(needs.*.result, 'failure') }}
        run: exit 1

      - name: All jobs passed or skipped?
        if: ${{ !(contains(needs.*.result, 'failure')) }}
        run: echo "All jobs passed or skipped" && echo "${{ toJSON(needs.*.result) }}"
