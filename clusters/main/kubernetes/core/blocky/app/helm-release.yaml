---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: blocky
  namespace: blocky
spec:
  interval: 15m
  chart:
    spec:
      chart: blocky
      version: 25.1.0
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
      interval: 15m
  timeout: 20m
  maxHistory: 3
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    TZ: Europe/Berlin
    # Enables /api/stats (in-memory, per pod) for the BlockyUI overview cards
    blockyConfig:
      statistics:
        enable: true
    ## set stopAll to "true" if you do not want to use blocky
    # and/or disable its service
    global:
      stopAll: false
    dependencies:
      postgresql:
        depconfig:
          password: ${POSTGRES_PW}
      valkey:
        depconfig:
          password: ${VALKEY_PW}
    ingress:
      main:
        enabled: true
        ingressClassName: internal
        integrations:
          traefik:
            enabled: false
          certManager:
            enabled: true
            certificateIssuer: domain-0-le-prod
        hosts:
          - host: blocky.${DOMAIN_0}
            paths:
              - path: /
                pathType: Prefix
    service:
      dns:
        externalTrafficPolicy: Local
        loadBalancerIP: ${BLOCKY_IP}
        type: LoadBalancer
        integrations:
          metallb:
            enabled: true
    k8sgateway:
      # -- list of processed domains
      domains:
      - domain: "${DOMAIN_0}"
        # -- Optional configuration option for DNS01 challenge that will redirect all acme
        # challenge requests to external cloud domain (e.g. managed by cert-manager)
        # See: https://cert-manager.io/docs/configuration/acme/dns01/
        dnsChallenge:
          enabled: false
          domain: dns01.clouddns.com

      forward:
        enabled: false
        primary: tls://1.1.1.1
        secondary: tls://1.0.0.1
        options:
          - name: tls_servername
            value: cloudflare-dns.com

    defaultUpstreams:
      - ${GATEWAY}
    bootstrapDns:
      upstream: "${GATEWAY}"
    clientLookup:
      # -- upstream used for client-name lookup
      upstream: "${GATEWAY}"
    blocking:
      whitelist:
      - name: default-own
        lists:
        # The anudeepND lists come from the chart's "default" group, which is left out
        # below because it also carries the 55k-entry LowWL allowlist that unblocks ads
        - https://raw.githubusercontent.com/anudeepND/whitelist/master/domains/optional-list.txt
        - https://raw.githubusercontent.com/anudeepND/whitelist/master/domains/whitelist.txt
        - ${OWN_WHITELIST}
      blacklist:
      - name: default-own
        lists:
        # Denylists of the chart's "default" group (see the whitelist note above)
        - https://big.oisd.nl/domainswild
        - https://raw.githubusercontent.com/StevenBlack/hosts/master/hosts
        - https://raw.githubusercontent.com/matomo-org/referrer-spam-blacklist/master/spammers.txt
        - https://someonewhocares.org/hosts/zero/hosts
        - https://raw.githubusercontent.com/VeleSila/yhosts/master/hosts
        - https://winhelp2002.mvps.org/hosts.txt
        - https://v.firebog.net/hosts/neohostsbasic.txt
        - https://raw.githubusercontent.com/RooneyMcNibNug/pihole-stuff/master/SNAFU.txt
        - https://paulgb.github.io/BarbBlock/blacklists/hosts-file.txt
        - https://hostsfile.org/Downloads/hosts.txt
        - https://www.joewein.net/dl/bl/dom-bl-base.txt
        - https://v.firebog.net/hosts/Kowabit.txt
        - https://adblock.mahakala.is
        - https://raw.githubusercontent.com/jdlingyu/ad-wars/master/hosts
        - https://s3.amazonaws.com/lists.disconnect.me/simple_ad.txt
        - https://www.github.developerdan.com/hosts/lists/ads-and-tracking-extended.txt
        - https://raw.githubusercontent.com/Perflyst/PiHoleBlocklist/master/android-tracking.txt
        - https://raw.githubusercontent.com/Perflyst/PiHoleBlocklist/master/SmartTV.txt
        - https://raw.githubusercontent.com/Perflyst/PiHoleBlocklist/master/AmazonFireTV.txt
        - https://gitlab.com/quidsup/notrack-blocklists/raw/master/notrack-blocklist.txt
        - https://hostfiles.frogeye.fr/multiparty-trackers-hosts.txt
        - https://raw.githubusercontent.com/Kees1958/W3C_annual_most_used_survey_blocklist/6b8c2411f22dda68b0b41757aeda10e50717a802/TOP_EU_US_Ads_Trackers_HOST
        - https://v.firebog.net/hosts/RPiList-Malware.txt
        - https://v.firebog.net/hosts/RPiList-Phishing.txt
        - https://malware-filter.gitlab.io/malware-filter/phishing-filter-hosts.txt
        - https://s3.amazonaws.com/lists.disconnect.me/simple_malvertising.txt
        - https://raw.githubusercontent.com/tg12/pihole-phishtank-list/master/list/phish_domains.txt
        - https://raw.githubusercontent.com/HorusTeknoloji/TR-PhishingList/master/url-lists.txt
        - ${OWN_BLACKLIST}
      clientGroupsBlock:
        - name: default
          groups:
          - default-ads
          - default-tracking
          - default-malicious
          - default-suspicious
          - default-own

    # CANNOT be defined in above yaml section
    queryLog:
      # optional one of: mysql, postgresql, csv, csv-client. If empty, log to console only
      type: "postgresql"
