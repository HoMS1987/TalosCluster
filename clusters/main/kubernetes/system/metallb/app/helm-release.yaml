apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: metallb
  namespace: metallb
spec:
  interval: 5m
  chart:
    spec:
      chart: metallb
      version: 0.16.2
      sourceRef:
        kind: HelmRepository
        name: metallb
        namespace: flux-system
      interval: 5m
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    speaker:
      ignoreExcludeLB: true
  postRenderers:
    # The statuscleaner runs with hostNetwork on port 19443. On a single node the
    # default RollingUpdate (maxUnavailable rounds down to 0) deadlocks: the new
    # pod cannot bind the port while the old one still holds it.
    - kustomize:
        patches:
          - target:
              kind: Deployment
              name: metallb-frr-k8s-statuscleaner
            patch: |
              - op: replace
                path: /spec/strategy
                value:
                  type: Recreate
