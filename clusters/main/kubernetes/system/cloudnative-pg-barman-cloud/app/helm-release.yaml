apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: plugin-barman-cloud
  # Must run in the namespace of the CloudNativePG operator
  namespace: cloudnative-pg
spec:
  interval: 5m
  # The plugin registers with the CNPG operator and gets its TLS certificates from cert-manager.
  # Waits for both HelmReleases to be Ready, not only applied (the Kustomizations have no wait)
  dependsOn:
    - name: cloudnative-pg
    - name: cert-manager
      namespace: cert-manager
  chart:
    spec:
      chart: plugin-barman-cloud
      version: 0.9.0
      sourceRef:
        kind: HelmRepository
        name: cloudnative-pg
        namespace: flux-system
      interval: 5m
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  values:
    crds:
      create: true
