# Follows the TrueCharts clustertool template
# (embed/generic/kubernetes/apps/system/cnpg-system/plugin-barman-cloud).
# Deviation: the plugin must run in the operator's namespace, which is cloudnative-pg here, not cnpg-system.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: plugin-barman-cloud
  namespace: cloudnative-pg
spec:
  interval: 1h
  dependsOn:
    - name: cloudnative-pg
    - name: cert-manager
      namespace: cert-manager
  chart:
    spec:
      chart: plugin-barman-cloud
      version: 0.9.0
      sourceRef:
        kind: HelmRepository
        name: cloudnative-pg
        namespace: flux-system
  values:
    crds:
      create: true
