---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/monitoring.coreos.com/alertmanagerconfig_v1alpha1.json
apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: alertmanager
  namespace: kube-prometheus-stack
spec:
  # Used as the global Alertmanager configuration (alertmanagerSpec.alertmanagerConfiguration),
  # so routes match alerts from all namespaces
  route:
    groupBy: ["alertname", "namespace"]
    groupWait: 1m
    groupInterval: 10m
    repeatInterval: 12h
    receiver: telegram
    routes:
      # Always firing: pinged to healthchecks.io as a dead man's switch
      - receiver: heartbeat
        groupWait: 0s
        groupInterval: 5m
        repeatInterval: 5m
        matchers:
          - name: alertname
            value: Watchdog
            matchType: "="
      - receiver: "null"
        matchers:
          - name: alertname
            value: InfoInhibitor
            matchType: "="
      - receiver: "null"
        matchers:
          - name: severity
            value: info|none
            matchType: "=~"
  inhibitRules:
    - sourceMatch:
        - name: severity
          value: critical
          matchType: "="
      targetMatch:
        - name: severity
          value: warning
          matchType: "="
      equal: ["alertname", "namespace"]
  receivers:
    - name: "null"
    - name: heartbeat
      webhookConfigs:
        - urlSecret:
            name: &secret alertmanager-secret
            key: HEARTBEAT_URL
          sendResolved: false
    - name: telegram
      telegramConfigs:
        - botToken:
            name: *secret
            key: TELEGRAM_BOT_TOKEN
          # Telegram chat with the bot (not secret: sending requires the bot token)
          chatID: 837726399
          parseMode: HTML
          sendResolved: true
          message: |-
            {{- range .Alerts }}
            {{ if eq .Status "firing" }}🔥{{ else }}✅{{ end }} <b>{{ .Labels.alertname }}</b>{{ with .Labels.severity }} ({{ . }}){{ end }}
            {{- with .Annotations.summary }}
            {{ . | html }}{{ end }}
            {{- with .Annotations.description }}
            {{ . | html }}{{ end }}
            {{- with .Labels.namespace }}
            <i>Namespace:</i> {{ . }}{{ end }}
            {{- with .Labels.pod }}
            <i>Pod:</i> {{ . }}{{ end }}
            {{ end }}
