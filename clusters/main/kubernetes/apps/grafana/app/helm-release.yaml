apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: grafana
  namespace: grafana
spec:
  interval: 15m
  chart:
    spec:
      # renovate: registryUrl=https://charts.truechartsoci.org
      chart: grafana
      version: 25.0.1
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
      interval: 15m
  install:
    createNamespace: true
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  values:
    global:
      stopAll: false
    dependencies:
      postgresql:
        depconfig:
          password: ${POSTGRES_PW}
        operator:
          # common-2026: stay on 16 for the chart move, upgrade to 18 in a separate step
          pgVersion: 16
    ingress:
      main:
        enabled: true
        ingressClassName: internal
        integrations:
          traefik:
            enabled: false
          certManager:
            enabled: true
            certificateIssuer: domain-0-le-prod
        hosts:
          - host: grafana.${DOMAIN_0}
            paths:
              - path: /
                pathType: Prefix
    # The admin password lives in the chart's env-secrets, which the main container
    # and the provisioning sidecars (REQ_PASSWORD) both read
    secret:
      env-secrets:
        data:
          GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PW}
    workload:
      main:
        podSpec:
          containers:
            main:
              env:
                GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN}
