apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kitchenowl
  namespace: kitchenowl
spec:
  interval: 5m
  chart:
    spec:
      chart: kitchenowl
      version: 16.0.0
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
      interval: 5m
  timeout: 120m
  install:
    disableWait: true
    createNamespace: true
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  values:
    global:
      stopAll: false
    kitchenowl:
      # common-2026 no longer generates the JWT signing key
      jwtSecretKey: ${KITCHENOWL_JWT_SECRET}
    credentials:
      cloudflare:
        type: s3
        url: "${CLOUDFLARE_BUCKET_URL}"
        bucket: "kitchenowl"
        accessKey: "${CLOUDFLARE_BUCKET_ACCESS_KEY}"
        secretKey: "${CLOUDFLARE_BUCKET_SECRET_KEY}"
        encrKey: "${CLOUDFLARE_BUCKET_ENCR_KEY}"
    ingress:
      main:
        enabled: true
        ingressClassName: external
        integrations:
          traefik:
            enabled: false
          certManager:
            enabled: true
            certificateIssuer: domain-0-le-prod
        hosts:
          - host: kitchenowl.${DOMAIN_0}
            paths:
              - path: /
                pathType: Prefix
    persistence:
      data:
        volsync:
        - name: data
          type: restic
          credentials: cloudflare
          dest:
            enabled: true
          src:
            enabled: true
            trigger:
              schedule: 50 3 * * *
    dependencies:
      postgresql:
        depconfig:
          password: ${POSTGRES_PW}
        operator:
          cluster:
            singleNode: true
          mode: recovery
          backups:
            enabled: true
            # PostgreSQL 18 (pg_upgrade): new system ID and timeline, so a new archive
            revision: "2"
            credentials: cloudflare
            scheduledBackups:
              - name: daily-backup
                schedule: "0 55 3 * * *"
                backupOwnerReference: self
                immediate: true
                suspend: false
          recovery:
            method: object_store
            credentials: cloudflare
            # A rebuild restores from the current archive; bump backups.revision before it
            revision: "2"
