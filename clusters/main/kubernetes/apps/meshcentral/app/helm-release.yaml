apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: meshcentral
  namespace: meshcentral
spec:
  interval: 5m
  chart:
    spec:
      # renovate: registryUrl=https://charts.truechartsoci.org
      chart: meshcentral
      version: 21.0.0
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
      interval: 5m
  install:
    disableWait: true
    createNamespace: true
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  timeout: 120m
  releaseName: meshcentral
  values:
    global:
      stopAll: false
    credentials:
      cloudflare:
        type: s3
        url: "${CLOUDFLARE_BUCKET_URL}"
        bucket: "meshcentral"
        accessKey: "${CLOUDFLARE_BUCKET_ACCESS_KEY}"
        secretKey: "${CLOUDFLARE_BUCKET_SECRET_KEY}"
        encrKey: "${CLOUDFLARE_BUCKET_ENCR_KEY}"
    dependencies:
      postgresql:
        depconfig:
          password: ${POSTGRES_PW}
        operator:
          # common-2026: stay on 16 for the chart move, upgrade to 18 in a separate step
          pgVersion: 16
          cluster:
            singleNode: true
          mode: recovery
          backups:
            enabled: true
            revision: "1"
            credentials: cloudflare
            scheduledBackups:
              - name: daily-backup
                schedule: "0 45 1 * * *"
                backupOwnerReference: self
                immediate: true
                suspend: false
          recovery:
            method: object_store
            credentials: cloudflare
    ingress:
      main:
        enabled: true
        ingressClassName: external
        annotations:
          nginx.ingress.kubernetes.io/backend-protocol: "HTTPS"
        integrations:
          traefik:
            enabled: false
          certManager:
            enabled: true
            certificateIssuer: domain-0-le-prod
        hosts:
          - host: meshcentral.${DOMAIN_0}
            paths:
              - path: /
                pathType: Prefix
    meshcentral:
      domains:
        "":
          certUrl: https://meshcentral.${DOMAIN_0}
          title: MeshCentral
          title2: HoMSserver
      settings:
        cert: meshcentral.${DOMAIN_0}
        # common-2026 no longer generates the session key
        sessionKey: ${MESHCENTRAL_SESSION_KEY}
    persistence:
      data:
        volsync:
          - name: data
            type: restic
            credentials: cloudflare
            dest:
              enabled: true
            src:
              enabled: true
              trigger:
                schedule: 50 1 * * *
      files:
        volsync:
          - name: files
            type: restic
            credentials: cloudflare
            dest:
              enabled: true
            src:
              enabled: true
              trigger:
                schedule: 0 2 * * *
      web:
        volsync:
          - name: web
            type: restic
            credentials: cloudflare
            dest:
              enabled: true
            src:
              enabled: true
              trigger:
                schedule: 10 2 * * *
      backups:
        volsync:
          - name: backups
            type: restic
            credentials: cloudflare
            dest:
              enabled: true
            src:
              enabled: true
              trigger:
                schedule: 20 2 * * *
    service:
      main:
        ports:
          main:
            protocol: https
