# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: paperless-ngx
  namespace: paperless-ngx
spec:
  interval: 15m
  chart:
    spec:
      chart: paperless-ngx
      version: 15.13.2
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
      interval: 15m
  timeout: 20m
  maxHistory: 3
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    TZ: Europe/Berlin
    credentials:
      cloudflare:
        type: s3
        url: "${CLOUDFLARE_BUCKET_URL}"
        bucket: "paperless-ngx"
        accessKey: "${CLOUDFLARE_BUCKET_ACCESS_KEY}"
        secretKey: "${CLOUDFLARE_BUCKET_SECRET_KEY}"
        encrKey: "${CLOUDFLARE_BUCKET_ENCR_KEY}"
    cnpg:
      main:
        password: ${POSTGRES_PW}
        cluster:
          singleNode: true
        backups:
          enabled: true
          credentials: cloudflare
          retentionPolicy: "7d"
          scheduledBackups:
            - name: daily-backup
              schedule: "0 45 4 * * *"
              backupOwnerReference: self
              immediate: true
              suspend: false
    tika:
      enabled: true
    # Chart default (1500m / 2400Mi) gets OOM-killed when OCR rasterizes multi-page PDFs (OCR mode force)
    resources:
      limits:
        cpu: 4000m
        memory: 6Gi
    ingress:
      main:
        enabled: true
        ingressClassName: internal
        integrations:
          traefik:
            enabled: false
          certManager:
            enabled: true
            certificateIssuer: domain-0-le-prod
        hosts:
          - host: paperless.${DOMAIN_0}
            paths:
              - path: /
                pathType: Prefix
    persistence:
      media:
        type: nfs
        server: ${TRUENAS_IP}
        path: /mnt/MAIN/paperless/media
      consume:
        type: nfs
        server: ${TRUENAS_IP}
        path: /mnt/MAIN/paperless/consume
      export:
        enabled: true
        type: nfs
        server: ${TRUENAS_IP}
        path: /mnt/MAIN/paperless/export
        mountPath: /export
    workload:
      main:
        podSpec:
          containers:
            main:
              env:
                PAPERLESS_URL: "{{ .Values.chartContext.appUrl }}"
                PAPERLESS_OCR_LANGUAGE: "deu+eng"
                PAPERLESS_OCR_LANGUAGES: "deu eng"
                PAPERLESS_CONSUMER_POLLING_INTERVAL: "60"
                PAPERLESS_CONSUMER_RECURSIVE: "true"
                PAPERLESS_CONSUMER_SUBDIRS_AS_TAGS: "true"
                PAPERLESS_CONSUMER_DELETE_DUPLICATES: "true"
                PAPERLESS_FILENAME_DATE_ORDER: "YMD"
                # The chart renders env values with tpl, so the Paperless template is wrapped in a string literal
                PAPERLESS_FILENAME_FORMAT: '{{ "{{ correspondent }}/{{ created_year }}/{{ created }} {{ title }}" }}'
