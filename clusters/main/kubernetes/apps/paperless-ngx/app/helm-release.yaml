apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: paperless-ngx
  namespace: paperless-ngx
spec:
  interval: 15m
  chart:
    spec:
      chart: paperless-ngx
      version: 19.1.0
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
      interval: 15m
  timeout: 20m
  maxHistory: 3
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    TZ: Europe/Berlin
    credentials:
      cloudflare:
        type: s3
        url: "${CLOUDFLARE_BUCKET_URL}"
        bucket: "paperless-ngx"
        accessKey: "${CLOUDFLARE_BUCKET_ACCESS_KEY}"
        secretKey: "${CLOUDFLARE_BUCKET_SECRET_KEY}"
        encrKey: "${CLOUDFLARE_BUCKET_ENCR_KEY}"
    paperless:
      # common-2026 no longer generates the Django secret key
      secretKey: ${PAPERLESS_SECRET_KEY}
    # Paperless (3.5.1) pins gotenberg-client 1.0.0, which still sends the form field "pdfa"
    # that Gotenberg 9 rejects, so Office/mail conversion breaks (paperless-ngx#14839).
    # Stay on Gotenberg 8 until a Paperless release supports 9.
    gotenbergImage:
      tag: 8.40@sha256:53073e798c8ef39ea2187e44cb67bab77894ea2509100b94c4fe3b461f7b2996
    dependencies:
      postgresql:
        depconfig:
          password: ${POSTGRES_PW}
        operator:
          # common-2026: stay on 16 for the chart move, upgrade to 18 in a separate step
          pgVersion: 16
          cluster:
            singleNode: true
          backups:
            enabled: true
            credentials: cloudflare
            retentionPolicy: "7d"
            scheduledBackups:
              - name: daily-backup
                schedule: "0 45 4 * * *"
                backupOwnerReference: self
                immediate: true
                suspend: false
      valkey:
        depconfig:
          password: ${VALKEY_PW}
    tika:
      enabled: true
    # Chart default (1500m / 2400Mi) gets OOM-killed when OCR rasterizes multi-page PDFs (OCR mode force)
    resources:
      limits:
        cpu: 4000m
        memory: 6Gi
    ingress:
      main:
        enabled: true
        ingressClassName: internal
        integrations:
          traefik:
            enabled: false
          certManager:
            enabled: true
            certificateIssuer: domain-0-le-prod
        hosts:
          - host: paperless.${DOMAIN_0}
            paths:
              - path: /
                pathType: Prefix
    persistence:
      media:
        type: nfs
        server: ${TRUENAS_IP}
        path: /mnt/MAIN/paperless/media
      consume:
        type: nfs
        server: ${TRUENAS_IP}
        path: /mnt/MAIN/paperless/consume
      export:
        enabled: true
        type: nfs
        server: ${TRUENAS_IP}
        path: /mnt/MAIN/paperless/export
        mountPath: /export
    workload:
      main:
        podSpec:
          containers:
            main:
              env:
                PAPERLESS_URL: "{{ .Values.chartContext.appUrl }}"
                PAPERLESS_OCR_LANGUAGE: "deu+eng"
                PAPERLESS_OCR_LANGUAGES: "deu eng"
                PAPERLESS_CONSUMER_POLLING_INTERVAL: "60"
                PAPERLESS_CONSUMER_RECURSIVE: "true"
                PAPERLESS_CONSUMER_SUBDIRS_AS_TAGS: "true"
                PAPERLESS_CONSUMER_DELETE_DUPLICATES: "true"
                PAPERLESS_FILENAME_DATE_ORDER: "YMD"
                # The chart renders env values with tpl, so the Paperless template is wrapped in a string literal
                PAPERLESS_FILENAME_FORMAT: '{{ "{{ correspondent }}/{{ created_year }}/{{ created }} {{ title }}" }}'
