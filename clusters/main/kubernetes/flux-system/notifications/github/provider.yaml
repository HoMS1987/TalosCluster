---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/notification.toolkit.fluxcd.io/provider_v1beta3.json
apiVersion: notification.toolkit.fluxcd.io/v1beta3
kind: Provider
metadata:
  name: github
  namespace: flux-system
spec:
  type: github
  address: https://github.com/HoMS1987/TalosCluster
  secretRef:
    name: github-status-token
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/notification.toolkit.fluxcd.io/alert_v1beta3.json
apiVersion: notification.toolkit.fluxcd.io/v1beta3
kind: Alert
metadata:
  name: github-status
  namespace: flux-system
spec:
  providerRef:
    name: github
  # Kustomizations built from this repository report success or failure as a commit status.
  # Kustomization/flux is left out: its OCI source revision points to a fluxcd/flux2 commit (GitHub answers 422).
  eventSeverity: info
  eventSources:
    - kind: Kustomization
      name: flux-entry
    - kind: Kustomization
      name: "*"
      matchLabels:
        notification.flux.home.arpa/github-status: "true"
