# Directories of HelmReleases that are not installed during CI testing
skipList:
  # Needs the real cluster network, storage or hardware
  - clusters/main/kubernetes/kube-system/cilium/app
  - clusters/main/kubernetes/system/longhorn/app
  - clusters/main/kubernetes/system/openebs/app
  - clusters/main/kubernetes/system/metallb/app
  - clusters/main/kubernetes/core/metallb-config/app
  - clusters/main/kubernetes/system/nvidia-device-plugin/app
  - clusters/main/kubernetes/system/spegel/app
  - clusters/main/kubernetes/core/clusterissuer/app
  - clusters/main/kubernetes/apps/plex/app
  # Needs the database secret created by the blocky release
  - clusters/main/kubernetes/core/blocky-ui/app
  # Needs its CRDs, which the test installs without
  - clusters/main/kubernetes/kube-system/node-feature-discovery/app

